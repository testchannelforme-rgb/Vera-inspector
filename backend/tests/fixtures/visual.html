<!doctype html><html lang="en"><meta charset="utf-8"><title>Visual fidelity fixture</title>
<style>
body{margin:0;background:#111;color:#eee;font:16px/1.5 system-ui}.hero{position:relative;isolation:isolate;overflow:hidden;padding:32px;min-height:320px;background-color:#25335a;background-image:linear-gradient(120deg,#173756 10%,#432358 90%),radial-gradient(circle at 80% 30%,#28a7 0%,transparent 60%);background-size:cover,100% 100%;background-position:center,right top}
.hero::before{content:"";position:absolute;inset:20px 5% 50%;background:conic-gradient(from 45deg,#f338,#53a9,#f338);filter:blur(8px);opacity:.5;z-index:-1}.title-stack{position:relative;height:110px}.title-stack h1{position:absolute;inset:0;margin:0;font-size:48px;font-weight:800;letter-spacing:-1px}.base{color:#204070}.overlay{color:#ffffff;background-image:linear-gradient(90deg,#f9a,#acf);background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 1px 2px #0003}.cards{display:flex;gap:20px;padding:24px}.card{position:relative;width:240px;border:1px solid #668;border-radius:12px;padding:20px;background:#263046}.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 0%,#9af4,transparent);pointer-events:none}.card img{width:100%;height:60px;object-fit:cover;border-radius:8px}button{padding:10px 20px;background:#6b8edb;color:white;border-radius:8px;border:0;transition:transform .2s}button:hover{transform:translateY(-3px)}.mask{mask-image:linear-gradient(black,transparent);mix-blend-mode:screen}.background-asset{background-image:linear-gradient(90deg,#224,#668),url('/missing.png?token=fixture-only');background-size:cover}
@media(max-width:600px){.cards{flex-direction:column}.title-stack h1{font-size:30px}.hero{padding:20px}}
</style>
<section class="hero"><div class="title-stack"><h1 class="base">Build Something</h1><h1 id="target" class="overlay" aria-hidden="true">Build Something</h1></div><p>Measured composition, not a pixel-color claim.</p><button>Explore</button></section>
<div class="cards"><article class="card"><img src="/missing.png" alt="Unavailable fixture image"><h2>Clear structure</h2><p>Local card evidence.</p></article><article class="card background-asset"><h2>Layered paint</h2><p class="mask">Mask and blend metadata.</p></article></div>
</html>
