<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#182536;color:#f3ece1;font:16px Arial}section,header{box-sizing:border-box;width:640px;padding:24px;position:relative}h1{font-size:36px;margin:0}p{line-height:1.5}button{border:0;padding:12px;background:#d95526;color:white;border-radius:8px}button:hover{background:#2b8d95}header{display:flex;justify-content:space-between;align-items:center;background:#294b63}.hero{display:grid;grid-template-columns:2fr 1fr;gap:20px}.orb{position:absolute;right:12px;top:8px;width:30px;height:30px;background:#ffca42;border-radius:50%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cards article{background:#516b3b;padding:16px;border-radius:12px}.responsive{display:flex;gap:20px;align-items:center}.motion{background:linear-gradient(90deg,#a63718,#285799)}.motion button{transition:transform .2s}.motion button:hover{transform:scale(1.1)}@media(max-width:600px){section,header{width:100%}.responsive{flex-direction:column}}
</style></head><body>
<header id="nav"><strong>MEASURED</strong><nav><button>Products</button></nav></header>
<section id="hero" class="hero"><div><h1>Build precise.</h1><p>Keep the original spacing and colors.</p><button>Start here</button></div><div class="orb"></div><img alt="Sample" width="100" height="80" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l9sAAAAASUVORK5CYII="></section>
<section id="grid" class="cards"><article>One</article><article>Two</article><article>Three</article></section>
<section id="responsive" class="responsive"><h1>Flexible</h1><p>Observed at this viewport.</p><button>Try</button></section>
<section id="motion" class="motion"><h1>Motion</h1><button>Hover</button><details><summary>Details</summary>Native disclosure</details></section>
</body></html>
