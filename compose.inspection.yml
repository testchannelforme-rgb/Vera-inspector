name: veyra-inspector
services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        VEYRA_REVISION: ${VEYRA_BUILD_REVISION:-unknown}
    environment:
      VEYRA_NETWORK_MODE: isolated-public
      VEYRA_PROXY_SERVER: http://172.30.88.2:8888
      VEYRA_PROXY_PASSWORD_FILE: /run/secrets/proxy_password
      VEYRA_CONTROL_TOKEN_FILE: /run/secrets/control_token
      VEYRA_ISOLATION_PROOF_FILE: /run/veyra/ready.json
      VEYRA_UI_ORIGIN: ${VEYRA_UI_ORIGIN:-}
      VEYRA_AI_ENABLED: ${VEYRA_AI_ENABLED:-false}
      VEYRA_AI_PROVIDER: ${VEYRA_AI_PROVIDER:-openai-compatible}
      VEYRA_AI_ENDPOINT: ${VEYRA_AI_ENDPOINT:-https://api.openai.com/v1/chat/completions}
      VEYRA_AI_MODEL: ${VEYRA_AI_MODEL:-}
      VEYRA_AI_API_KEY: ${VEYRA_AI_API_KEY:-}
      VEYRA_AI_TIMEOUT_SECONDS: ${VEYRA_AI_TIMEOUT_SECONDS:-15}
      VEYRA_AI_MAX_OUTPUT_TOKENS: ${VEYRA_AI_MAX_OUTPUT_TOKENS:-1500}
      VEYRA_AI_TOKEN_PARAMETER: ${VEYRA_AI_TOKEN_PARAMETER:-max_completion_tokens}
      VEYRA_CODE_AI_ENABLED: ${VEYRA_CODE_AI_ENABLED:-false}
      VEYRA_CODE_AI_MODEL: ${VEYRA_CODE_AI_MODEL:-}
      VEYRA_CODE_AI_API_KEY: ${VEYRA_CODE_AI_API_KEY:-}
      VEYRA_CODE_AI_ENDPOINT: ${VEYRA_CODE_AI_ENDPOINT:-https://api.openai.com/v1/chat/completions}
      VEYRA_REFINE_AI_ENABLED: ${VEYRA_REFINE_AI_ENABLED:-false}
      VEYRA_REFINE_AI_MODEL: ${VEYRA_REFINE_AI_MODEL:-}
      VEYRA_REFINE_AI_API_KEY: ${VEYRA_REFINE_AI_API_KEY:-}
      VEYRA_REFINE_AI_ENDPOINT: ${VEYRA_REFINE_AI_ENDPOINT:-https://api.openai.com/v1/chat/completions}
      VEYRA_REPAIR_AI_ENABLED: ${VEYRA_REPAIR_AI_ENABLED:-false}
      VEYRA_REPAIR_AI_ENDPOINT: ${VEYRA_REPAIR_AI_ENDPOINT:-https://api.openai.com/v1/chat/completions}
      VEYRA_REPAIR_AI_MODEL: ${VEYRA_REPAIR_AI_MODEL:-}
      VEYRA_REPAIR_AI_API_KEY: ${VEYRA_REPAIR_AI_API_KEY:-}
      VEYRA_REPAIR_AI_MAX_OUTPUT_TOKENS: ${VEYRA_REPAIR_AI_MAX_OUTPUT_TOKENS:-8192}
      VEYRA_CODE_AI_MAX_OUTPUT_TOKENS: ${VEYRA_CODE_AI_MAX_OUTPUT_TOKENS:-8192}
      VEYRA_REFINE_AI_MAX_OUTPUT_TOKENS: ${VEYRA_REFINE_AI_MAX_OUTPUT_TOKENS:-8192}
      VEYRA_OPERATOR_PLAN: ${VEYRA_OPERATOR_PLAN:-free}
      VEYRA_FREE_GENERATIONS_PER_DAY: ${VEYRA_FREE_GENERATIONS_PER_DAY:-4}
      VEYRA_FREE_REFINEMENTS_PER_DAY: ${VEYRA_FREE_REFINEMENTS_PER_DAY:-2}
      VEYRA_FREE_PREVIEWS_PER_DAY: ${VEYRA_FREE_PREVIEWS_PER_DAY:-4}
      VEYRA_PREMIUM_GENERATIONS_PER_DAY: ${VEYRA_PREMIUM_GENERATIONS_PER_DAY:-50}
      VEYRA_PREMIUM_REFINEMENTS_PER_DAY: ${VEYRA_PREMIUM_REFINEMENTS_PER_DAY:-50}
      VEYRA_PREMIUM_PREVIEWS_PER_DAY: ${VEYRA_PREMIUM_PREVIEWS_PER_DAY:-100}
    secrets: [proxy_password, control_token]
    volumes: [browser_status:/run/veyra:ro, studio_usage:/opt/veyra/.veyra-runtime]
    ports: ["127.0.0.1:8001:8000"]
    networks: [control, internet]
    depends_on:
      browser: {condition: service_healthy}
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  browser:
    build:
      context: .
      dockerfile: docker/browser.Dockerfile
    init: true
    networks:
      control: {}
      browsing: {ipv4_address: 172.30.88.3}
    secrets: [control_token]
    volumes: [browser_status:/run/veyra]
    tmpfs: ["/tmp:rw,size=512m"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, CHOWN, DAC_OVERRIDE, SYS_CHROOT]
    security_opt: ["seccomp=./.devcontainer/seccomp_profile.json"]
    shm_size: 256m
    mem_limit: 1200m
    cpus: 1
    pids_limit: 256
    depends_on: [gateway]
    healthcheck:
      test: ["CMD", "node", "-e", "const p=JSON.parse(require('fs').readFileSync('/run/veyra/ready.json'));if(!p.sandboxEnabled)process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: [python, /opt/veyra/docker/gateway.py]
    secrets: [proxy_password]
    networks:
      browsing: {ipv4_address: 172.30.88.2}
      internet: {}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  control: {internal: true}
  browsing:
    internal: true
    ipam:
      config: [{subnet: 172.30.88.0/24}]
  internet: {}
volumes:
  browser_status: {}
  studio_usage: {}
secrets:
  control_token: {file: .veyra-runtime/control_token}
  proxy_password: {file: .veyra-runtime/proxy_password}
